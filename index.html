<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#138A6D">
<title>Mentha CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#F1F8F4;--surface:#FFFFFF;--surface2:#F4FAF7;--ink:#163029;--muted:#5D7870;--line:#D9EAE2;--brand:#138A6D;--brand-ink:#0A5C49;--brand-soft:#DCF3E9;--brand-2:#2FB088;--accent:#2FA57F;--accent-soft:#E4F6EE;--danger:#C2413A;--danger-soft:#FBE5E3;--warn:#A86F0E;--warn-soft:#FBF1DC;--g:#4285F4;--radius:14px;--shadow:0 1px 2px rgba(10,60,45,.05),0 8px 22px rgba(10,60,45,.06)}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:radial-gradient(1200px 400px at 10% -10%,#DDF3E9 0,transparent 60%),var(--bg);background-attachment:fixed}
body{margin:0;color:var(--ink);font:15px/1.45 'DM Sans',system-ui,-apple-system,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
a{color:var(--brand-ink)}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);border-top:4px solid var(--brand)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-family:Fraunces,serif;font-size:21px;color:var(--brand-ink);display:flex;align-items:center;gap:10px;white-space:nowrap;line-height:1.05}
.logo .leaf{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-soft),#BFE8D6);display:grid;place-items:center;font-size:18px}
.logo small{font-family:'DM Sans',system-ui,sans-serif;font-size:10.5px;color:var(--muted);display:block;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.month{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.month button:hover{background:var(--brand-soft)}
.month span{font-weight:600;min-width:122px;text-align:center;font-size:14px}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px 'DM Sans',system-ui,sans-serif;padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand-ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px}
@media(max-width:820px){
 header.top{border-top-width:3px}
 .topin{padding:8px 12px;gap:8px}
 .month{flex:0 0 auto}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .v{font-size:19px}
 nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(10,60,45,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:0;margin:0;max-width:none}
 nav.tabs button.on{background:var(--brand-soft)}
 nav.tabs button{flex:1 1 0;min-width:0;flex-direction:column;font-size:9.5px;letter-spacing:-.01em;padding:5px 1px;gap:1px;overflow:hidden;text-overflow:ellipsis}
 nav.tabs button i{font-size:19px}
 .logo small{display:none}.logo{font-size:18px}.logo .leaf{display:none}
 .month span{min-width:104px;font-size:13.5px}
 .month button{width:36px;height:36px;font-size:18px}
 main{padding:14px 12px}
}
nav.tabs button i{font-style:normal}
.btn{appearance:none;border:0;background:linear-gradient(135deg,var(--brand-2),var(--brand));box-shadow:0 2px 6px rgba(19,138,109,.22);color:#fff;font:600 14px 'DM Sans',system-ui,sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{box-shadow:none;background:var(--brand-soft);color:var(--brand-ink)}
.btn.g{background:var(--g);box-shadow:none}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.ghost.danger{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{border-top:3px solid var(--brand-soft)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.prog{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7BD3B2);border-radius:99px;transition:width .5s}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--surface2)}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
tfoot td{font-weight:700;border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap;border:0;font-family:inherit}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.pink{background:var(--accent-soft);color:#167556;border:1px solid #C6EAD9}
.pill.gg{background:#E3ECFD;color:#1A56C9}
button.pill{cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar h2{margin:0 auto 0 0;font-family:Fraunces,serif;font-size:25px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input[type=checkbox]{width:auto}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
#modal{position:fixed;inset:0;background:rgba(10,25,21,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px 10px;overflow-y:auto}
#modal.open{display:flex}
.mbox{background:var(--surface);border-radius:16px;width:100%;max-width:580px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto 0}
.mbox.wide{max-width:900px}
.mhead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-family:Fraunces,serif;font-size:20px;font-weight:600}
.mhead .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-weight:500;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.day{font-weight:700;margin:18px 0 8px;color:var(--brand-ink);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px}
.day .muted{font-weight:500}
.appt{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand-2);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.appt.realizado{border-left-color:var(--brand-ink)}.appt.cancelado,.appt.faltou{opacity:.6;border-left-color:var(--danger)}
.appt.gcal{border-left-color:var(--g);border-style:dashed;border-left-style:solid}
.appt .time{font-weight:700;font-variant-numeric:tabular-nums;min-width:46px}
.appt .who{flex:1;min-width:150px}
.appt .who b{display:block}
.appt .acts{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 13px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.chip.on{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.alert{border:1px solid #F0D49A;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px}
.alert.info{border-color:var(--brand);background:var(--brand-soft)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.irow{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-bottom:6px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
details summary{cursor:pointer;font-weight:600;font-size:13.5px}
details[open] summary{margin-bottom:10px}
.sect{margin-bottom:16px}
.tinput{padding:6px 8px;border-radius:8px;font-size:13.5px}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.chartbox{position:relative;height:300px}

.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.caltitle::first-letter{text-transform:uppercase}
.caltitle{font-size:17px;margin-left:4px;font-family:Fraunces,serif;font-weight:600}
.btn.icon{width:34px;justify-content:center;padding:5px 0;font-size:17px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:600 13px 'DM Sans',system-ui,sans-serif;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.cal-month{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cm-head,.cm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cm-head{background:var(--surface2);border-bottom:1px solid var(--line)}
.cm-head div{padding:6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase}
.cm-cell{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cm-cell:nth-child(7n){border-right:0}
.cm-cell:nth-last-child(-n+7){border-bottom:0}
.cm-cell.out{background:var(--surface2)}.cm-cell.out .cm-day{color:#A3B8B0}
.cm-cell:hover{background:#F6FCF9}
.cm-day{align-self:center;border:0;background:transparent;font:600 12.5px 'DM Sans',system-ui,sans-serif;width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--ink);flex:0 0 auto}
.cm-day:hover{background:var(--brand-soft)}
.cm-cell.today .cm-day{background:var(--brand);color:#fff}
.cm-fill{flex:1;min-height:6px}
.cm-more{border:0;background:transparent;color:var(--brand-ink);font:600 11.5px 'DM Sans',system-ui,sans-serif;text-align:left;cursor:pointer;padding:0 4px}
.ev-chip{font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--brand);flex:0 0 auto}
.ev-chip.realizado{background:#EEF4F1;color:#4F6B62;border-left-color:#7FA99A}
.ev-chip.cancelado,.ev-chip.faltou{background:var(--danger-soft);color:var(--danger);text-decoration:line-through;border-left-color:var(--danger)}
.ev-chip.gcal{background:#E8F0FE;color:#1A56C9;border-left-color:var(--g)}
.ev-chip.pend,.ev.pend{outline:1.5px dashed var(--warn);outline-offset:-1px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
.tg-in{min-width:calc(56px + var(--n)*100px)}
.tg.one .tg-in{min-width:0}
.tg-head,.tg-all,.tg-body{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.tg-head,.tg-all{border-bottom:1px solid var(--line)}
.tg-dh{border:0;background:transparent;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:var(--muted)}
.tg-dh span{font-size:11px;text-transform:uppercase;font-weight:600}
.tg-dh b{font-size:20px;color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-weight:600}
.tg-dh:hover b{background:var(--brand-soft)}
.tg-dh.today span{color:var(--brand)}.tg-dh.today b{background:var(--brand);color:#fff}
.tg-all>div{padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.tg-all>.tg-lbl{border-left:0;justify-content:center;align-items:flex-end;padding-right:6px;font-size:10.5px}
.tg-hours div{position:relative}.tg-hours span{position:absolute;top:-8px;right:8px;font-size:11px;color:var(--muted)}
.tg-hours div:first-child span{display:none}
.tg-col{position:relative;border-left:1px solid var(--line);cursor:pointer}
.tg-line{border-top:1px solid var(--line)}.tg-line:first-child{border-top:0}
.tg-line:nth-child(n){background:linear-gradient(to bottom,transparent 49.5%,#EEF5F1 50%,transparent 51%)}
.tg-col:hover{background:#FAFDFB}
.tg-now{position:absolute;left:0;right:0;height:2px;background:#E5484D;z-index:3;pointer-events:none}.tg-now:before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E5484D}
.ev{position:absolute;z-index:2;border-radius:7px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.14);display:flex;flex-direction:column;border:1px solid #fff}
.ev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ev span{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ev.realizado{background:#86AE9F}
.ev.cancelado,.ev.faltou{background:var(--danger-soft);color:var(--danger);text-decoration:line-through}
.ev.gcal{background:#E8F0FE;color:#1A56C9;border-left:3px solid var(--g)}
.ev i{position:absolute;right:4px;top:2px;font-style:normal;font-size:11px}
.rfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rfilters label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.rfilters input,.rfilters select{width:auto}
@media(max-width:820px){
 .cm-cell{min-height:78px;padding:2px}.ev-chip{font-size:10px;padding:1px 3px;border-left-width:2px}.cm-head div{font-size:10px;padding:5px 0}
 .caltitle{font-size:16px;width:100%;order:-1;margin:0}
 .tg-in{min-width:calc(44px + var(--n)*84px)}
 .tg-head,.tg-all,.tg-body{grid-template-columns:44px repeat(var(--n),minmax(0,1fr))}
 .seg button{padding:6px 9px}
}
ol.steps{padding-left:18px;margin:6px 0}ol.steps li{margin-bottom:6px;font-size:13.5px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi .v{font-size:19px}.kpi .s{font-size:11.5px}}
</style>
</head>
<body>
<header class="top">
 <div class="topin">
  <div class="logo"><div class="leaf">🌿</div><div>Mentha<small>Nail Design · CRM</small></div></div>
  <div class="month"><button id="prevM" aria-label="Mês anterior">‹</button><span id="mLabel"></span><button id="nextM" aria-label="Próximo mês">›</button></div>
 </div>
 <nav class="tabs" id="tabs">
  <button data-t="painel"><i>📊</i>Painel</button>
  <button data-t="agenda"><i>📅</i>Agenda</button>
  <button data-t="receitas"><i>💰</i>Receitas</button>
  <button data-t="despesas"><i>💸</i>Despesas</button>
  <button data-t="clientes"><i>👩</i>Clientes</button>
  <button data-t="servicos"><i>💅</i>Serviços</button>
  <button data-t="relatorios"><i>📈</i>Relatórios</button>
  <button data-t="config"><i>⚙️</i>Config</button>
 </nav>
</header>
<main id="view"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= utilidades ================= */
const KEY='mentha_crm_v1';
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const p2=n=>String(n).padStart(2,'0');
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function findClient(nome){const n=norm(nome);if(!n)return null;let c=db.clients.find(x=>norm(x.nome)===n);if(c)return c;const cands=db.clients.filter(x=>norm(x.nome).startsWith(n+' '));return cands.length===1?cands[0]:null}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const PAGS=['Pix','Dinheiro','Crédito','Débito','Outros'];
const TIPOS=['Despesas fixas','Custos','Pró-labore','Investimentos'];
const MEIOS=['À vista','Cartão de crédito PF','Cartão de crédito PJ','Cartão de crédito Igor'];
const ORIGENS=['Instagram','Indicação','Google','Placa em frente ao estúdio','Site','Igreja','Cresol','Outro'];
const STATUS={agendado:['Agendado','pink'],realizado:['Realizado','ok'],cancelado:['Cancelado','bad'],faltou:['Faltou','warn']};
function todayISO(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addM(m,k){let[y,mo]=m.split('-').map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+p2(mo)}
function mDiff(a,b){const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by-ay)*12+(bm-am)}
function mLabel(m){const[y,mo]=m.split('-');return MESES[+mo-1]+' '+y}
function mShort(m){const[y,mo]=m.split('-');return MESES[+mo-1].slice(0,3)+'/'+y.slice(2)}

const PXH=56;
function agRange(){if(agView==='dia')return[agDate,agDate];if(agView==='semana'){const s=wkStart(agDate);return[s,addD(s,6)]}if(agView==='mes'){const s=wkStart(agDate.slice(0,7)+'-01');return[s,addD(s,41)]}return[agFrom||agDate.slice(0,7)+'-01',agTo||mEnd(agDate.slice(0,7))]}
function agTitle(){if(agView==='dia')return`${dow(agDate)}, ${fdl(agDate)} de ${agDate.slice(0,4)}`;if(agView==='semana'){const s=wkStart(agDate),e=addD(s,6);return`${fdl(s)} – ${fdl(e)} de ${e.slice(0,4)}`}if(agView==='mes')return mLabel(agDate.slice(0,7));const[f,t]=agRange();return`${fd(f)} a ${fd(t)}`}
function agNav(k){if(k===0){agDate=todayISO();agFrom='';agTo=''}else if(agView==='dia')agDate=addD(agDate,k);else if(agView==='semana')agDate=addD(agDate,7*k);else{agDate=addM(agDate.slice(0,7),k)+'-01';agFrom='';agTo=''}cur=agDate.slice(0,7);render()}
function agGo(d){if(!d)return;agDate=d;cur=d.slice(0,7);if(agView==='lista'){agFrom=d;agTo=''}render()}
function agSet(v){agView=v;try{localStorage.setItem('mentha_agview',v)}catch(e){}render()}
function agItems(f,t){
 const linked=new Set(db.appts.map(a=>a.gcalId).filter(Boolean));
 const L=db.appts.filter(a=>a.data>=f&&a.data<=t).map(a=>({a,data:a.data,ini:a.hora?toMin(a.hora):null,dur:durMin(a)}));
 (gEv.items||[]).filter(e=>!linked.has(e.id)&&e.status!=='cancelled').forEach(e=>{const s=e.start.dateTime||e.start.date;if(!s)return;const d=s.slice(0,10);if(d<f||d>t)return;const ini=e.start.dateTime?toMin(s.slice(11,16)):null;let dur=60;const en=e.end&&e.end.dateTime;if(e.start.dateTime&&en)dur=Math.max(15,Math.round((new Date(en)-new Date(s))/6e4));L.push({g:e,data:d,ini,dur})});
 return L.sort((x,y)=>x.data.localeCompare(y.data)||((x.ini??-1)-(y.ini??-1)));
}
function agEnsureG(f,t){if(!gReady())return;const k=f+'|'+t+'|'+cal();if(gEv.key===k||gEv.loading===k)return;gEv.loading=k;const tmin=encodeURIComponent(f+'T00:00:00-03:00'),tmax=encodeURIComponent(addD(t,1)+'T00:00:00-03:00');
 gFetch(`calendars/${cal()}/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin=${tmin}&timeMax=${tmax}`).then(j=>{gEv={key:k,items:(j&&j.items)||[]};if(tab==='agenda')render()}).catch(e=>{gEv.loading='';toast('Erro Google: '+e.message)})}
function gPendList(){const td=todayISO();return db.appts.filter(a=>a.gPending||(a.status==='agendado'&&a.data>=td&&!a.gcalId))}
function rAgenda(v){
 const[f,t]=agRange();agEnsureG(f,t);
 const pend=db.settings.gClientId?gPendList().length+(db.gDelQ||[]).length:0;
 const gBtn=!db.settings.gClientId?`<button class="btn ghost" onclick="go('config')">🔗 Conectar Google Agenda</button>`:gReady()?`<span class="pill gg" title="Os atendimentos criados aqui vão para o Google Agenda">● Google Agenda conectada</span><button class="btn ghost sm" onclick="gEv.key='';render()" title="Recarregar eventos do Google">↻</button>`:`<button class="btn g" onclick="gConnect(flushPending)">🔗 Entrar com Google</button>`;
 const V=[['dia','Dia'],['semana','Semana'],['mes','Mês'],['lista','Lista']];
 const nd=agView==='dia'||agDate>todayISO()?agDate:todayISO();
 v.innerHTML=`<div class="toolbar"><h2>Agenda</h2>${gBtn}${pend?`<button class="btn soft sm" onclick="gReady()?flushPending():gConnect(flushPending)" title="Agendamentos ainda não enviados ao Google Agenda">⟳ Enviar ${pend} ao Google</button>`:''}<button class="btn" onclick="apptForm(null,{data:'${nd}'})">+ Agendar</button></div>
 <div class="calbar sect"><b class="caltitle">${agTitle()}</b><button class="btn ghost sm" onclick="agNav(0)">Hoje</button><button class="btn ghost sm icon" onclick="agNav(-1)" aria-label="Anterior">‹</button><button class="btn ghost sm icon" onclick="agNav(1)" aria-label="Próximo">›</button><input type="date" class="tinput" style="width:auto" value="${agDate}" onchange="agGo(this.value)" title="Ir para a data"><span style="flex:1"></span><div class="seg">${V.map(([k,l])=>`<button class="${agView===k?'on':''}" onclick="agSet('${k}')">${l}</button>`).join('')}</div></div>
 ${agView==='lista'?`<div class="calbar sect"><label class="small muted">De <input type="date" class="tinput" style="width:auto" value="${f}" onchange="agFrom=this.value;render()"></label><label class="small muted">Até <input type="date" class="tinput" style="width:auto" value="${t}" onchange="agTo=this.value;render()"></label><div class="chips">${[['prox','Só agendados'],['todos','Todos']].map(([k,l])=>`<button class="chip ${agFilter===k?'on':''}" onclick="agFilter='${k}';render()">${l}</button>`).join('')}</div></div>`:''}
 ${agView==='mes'?calMonth(f):agView==='lista'?calList(f,t):calGrid(agView==='dia'?[agDate]:[0,1,2,3,4,5,6].map(i=>addD(f,i)))}
 <div class="chips small muted" style="margin-top:10px;gap:12px"><span><span class="ev-chip" style="display:inline-block">agendado</span></span><span><span class="ev-chip realizado" style="display:inline-block">realizado</span></span><span><span class="ev-chip gcal" style="display:inline-block">evento do Google</span></span><span><span class="ev-chip pend" style="display:inline-block">aguardando envio</span></span><span>Clique num horário vazio para agendar.</span></div>`;
}
function calList(f,t){let L=agItems(f,t);if(agFilter==='prox')L=L.filter(x=>x.g||x.a.status==='agendado');const td=todayISO();const groups={};L.forEach(x=>(groups[x.data]=groups[x.data]||[]).push(x));
 return L.length?Object.entries(groups).map(([d,arr])=>`<div class="day">${dow(d)}, ${fd(d)} ${d===td?'<span class="pill ok">hoje</span>':''}<span class="muted">${BRL(arr.filter(x=>x.a&&x.a.status!=='cancelado').reduce((s,x)=>s+rec(x.a),0))}</span></div>${arr.map(x=>x.a?apptCard(x.a):gCard(x)).join('')}`).join(''):`<div class="card empty">Nada entre ${fd(f)} e ${fd(t)}.</div>`}
function evChip(x){if(x.a){const a=x.a;return`<div class="ev-chip ${a.status} ${a.gPending?'pend':''}" onclick="event.stopPropagation();apptForm('${a.id}')" title="${esc(cname(a)+' — '+servs(a))}">${a.hora?`<b>${a.hora}</b> `:''}${esc(cname(a))}</div>`}const e=x.g;return`<div class="ev-chip gcal" onclick="event.stopPropagation();importGEvent('${e.id}')" title="${esc(e.summary||'')}">${x.ini!=null?`<b>${fromMin(x.ini)}</b> `:''}${esc(e.summary||'(sem título)')}</div>`}
function calMonth(f){const m=agDate.slice(0,7),td=todayISO();const L=agItems(f,addD(f,41));const by={};L.forEach(x=>(by[x.data]=by[x.data]||[]).push(x));const mx=innerWidth<760?2:3;
 let o=`<div class="cal-month"><div class="cm-head">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="cm-grid">`;
 for(let i=0;i<42;i++){const d=addD(f,i),arr=by[d]||[];
  o+=`<div class="cm-cell ${d.slice(0,7)!==m?'out':''} ${d===td?'today':''}" onclick="apptForm(null,{data:'${d}'})"><button class="cm-day" onclick="event.stopPropagation();agDate='${d}';agSet('dia')">${+d.slice(8)}</button>${arr.slice(0,mx).map(evChip).join('')}${arr.length>mx?`<button class="cm-more" onclick="event.stopPropagation();agDate='${d}';agSet('dia')">+${arr.length-mx} mais</button>`:''}<div class="cm-fill"></div></div>`}
 return o+'</div></div>'}
function layout(evs){evs.sort((a,b)=>a.ini-b.ini||b.dur-a.dur);let cl=[],end=-1;const out=[];const flush=()=>{const lanes=[];cl.forEach(x=>{let l=lanes.findIndex(e=>e<=x.ini);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=x.ini+x.dur;x.lane=l});cl.forEach(x=>x.lanes=lanes.length);out.push(...cl);cl=[]};evs.forEach(x=>{if(cl.length&&x.ini>=end)flush();cl.push(x);end=Math.max(end,x.ini+x.dur)});if(cl.length)flush();return out}
function calGrid(days){const td=todayISO(),one=days.length===1;const L=agItems(days[0],days[days.length-1]);
 let H0=8,H1=20;L.forEach(x=>{if(x.ini!=null){H0=Math.min(H0,Math.floor(x.ini/60));H1=Math.max(H1,Math.ceil((x.ini+x.dur)/60))}});H1=Math.min(24,H1);H0=Math.max(0,H0);
 const cols=days.map(d=>{const evs=L.filter(x=>x.data===d);return{d,all:evs.filter(x=>x.ini==null),tm:layout(evs.filter(x=>x.ini!=null))}});
 const hasAll=cols.some(c=>c.all.length),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
 const hrs=[...Array(H1-H0).keys()];
 return`<div class="tg ${one?'one':''}"><div class="tg-in" style="--n:${days.length}">
  <div class="tg-head"><div></div>${cols.map(c=>`<button class="tg-dh ${c.d===td?'today':''}" onclick="agDate='${c.d}';agSet('dia')"><span>${dow(c.d)}</span><b>${+c.d.slice(8)}</b></button>`).join('')}</div>
  ${hasAll?`<div class="tg-all"><div class="tg-lbl muted">sem hora</div>${cols.map(c=>`<div>${c.all.map(evChip).join('')}</div>`).join('')}</div>`:''}
  <div class="tg-body" style="height:${(H1-H0)*PXH}px"><div class="tg-hours">${hrs.map(i=>`<div style="height:${PXH}px"><span>${p2(H0+i)}:00</span></div>`).join('')}</div>
  ${cols.map(c=>`<div class="tg-col" onclick="slotClick(event,'${c.d}',${H0})">${hrs.map(()=>`<div class="tg-line" style="height:${PXH}px"></div>`).join('')}${c.d===td&&nowMin>=H0*60&&nowMin<=H1*60?`<div class="tg-now" style="top:${(nowMin-H0*60)/60*PXH}px"></div>`:''}${c.tm.map(x=>evBlock(x,H0,one)).join('')}</div>`).join('')}
  </div></div></div>`}
function evBlock(x,H0,wide){const top=(x.ini-H0*60)/60*PXH,hg=Math.max(22,x.dur/60*PXH-2),w=100/x.lanes,l=x.lane*w;const st=`top:${top}px;height:${hg}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px)`;
 if(x.a){const a=x.a,c=client(a.clientId)||{};return`<div class="ev ${a.status} ${a.gPending?'pend':''}" style="${st}" onclick="event.stopPropagation();apptForm('${a.id}')" title="${esc(cname(a)+' — '+servs(a))}"><b>${esc(cname(a))}</b><span>${a.hora} – ${fromMin(x.ini+x.dur)}${wide?' · '+esc(servs(a))+' · '+BRL(tot(a)):''}</span>${!wide&&hg>60?`<span>${esc(servs(a))}</span>`:''}${c.alergiaDesc?'<i title="Alergia">⚠️</i>':''}</div>`}
 const e=x.g;return`<div class="ev gcal" style="${st}" onclick="event.stopPropagation();importGEvent('${e.id}')" title="Evento do Google — clique para importar"><b>${esc(e.summary||'(sem título)')}</b><span>${fromMin(x.ini)} – ${fromMin(x.ini+x.dur)} · Google</span></div>`}
function slotClick(e,d,H0){const r=e.currentTarget.getBoundingClientRect();const m=Math.floor((e.clientY-r.top)/PXH*2)*30+H0*60;apptForm(null,{data:d,hora:fromMin(Math.min(Math.max(m,0),23*60+30))})}
function apptCard(a){
 const c=client(a.clientId)||{},st=STATUS[a.status]||['?',''];
 const w=waLink(c.telefone,`Oi ${cname(a).split(' ')[0]}! 🌿 Passando para confirmar seu horário ${dow(a.data)}, ${fds(a.data)} às ${a.hora||''} no Mentha Nail Design (${servs(a)}). Posso confirmar? 💅`);
 return`<div class="appt ${a.status}"><div class="time">${a.hora||'--:--'}</div><div class="who"><b>${esc(cname(a))} ${c.alergiaDesc?'<span class="pill bad" title="'+esc(c.alergiaDesc)+'">⚠️ alergia</span>':''}${c.gestante?' <span class="pill warn">gestante</span>':''}${c.diabetes?' <span class="pill warn">diabetes</span>':''}</b><span class="small muted">${esc(servs(a))} · ${BRL(tot(a))}${a.gcalId?' · <span style="color:var(--g)">● Google</span>':''}</span></div><span class="pill ${st[1]}">${st[0]}</span><div class="acts">${a.status==='agendado'?`<button class="btn sm" onclick="concluir('${a.id}')">✓ Concluir</button>${w?`<a class="btn sm soft" target="_blank" href="${w}">Lembrete</a>`:''}${!a.gcalId?`<a class="btn sm ghost" target="_blank" href="${gTemplate(a)}" title="Adicionar no Google Agenda">📅</a>`:''}`:''}<button class="btn sm ghost" onclick="apptForm('${a.id}')">✎</button></div></div>`;
}
function gCard(x){const e=x.g;return`<div class="appt gcal"><div class="time">${x.ini!=null?fromMin(x.ini):'dia'}</div><div class="who"><b>${esc(e.summary||'(sem título)')}</b><span class="small muted">Evento da Google Agenda</span></div><div class="acts"><button class="btn sm soft" onclick="importGEvent('${e.id}')">Importar</button></div></div>`}
function concluir(id){const a=db.appts.find(x=>x.id===id);modal('Concluir atendimento',`<p style="margin-top:0"><b>${esc(cname(a))}</b><br><span class="muted">${esc(servs(a))} · ${BRL(tot(a))}</span></p><label class="f">Forma de pagamento<select id="cPg">${opts(PAGS,a.pagamento||'Pix')}</select></label><label class="f">Adicional / desconto (R$, use negativo para desconto)<input id="cAd" type="number" step="0.01" value="${a.adicional||0}"></label>`,{saveLabel:'✓ Concluir',onSave:()=>{a.pagamento=$('cPg').value;a.adicional=+$('cAd').value||0;a.status='realizado';if(a.gcalId){a.gPending=true;if(gReady())syncAppt(a,true)}save();closeModal();render();toast('Concluído · recebido '+BRL(rec(a)))}})}

/* ===== formulário de atendimento ===== */
function itemRow(it={}){
 const names=db.services.filter(s=>s.ativo||s.nome===it.servico).map(s=>s.nome);
 if(it.servico&&!names.includes(it.servico))names.push(it.servico);
 return`<div class="irow"><select class="is" onchange="itemSel(this)"><option value="">Serviço…</option>${opts(names,it.servico)}</select><input class="iv" type="number" step="0.01" inputmode="decimal" placeholder="R$" value="${it.valor??''}" oninput="updTot()"><button type="button" class="btn ghost sm" onclick="this.parentNode.remove();updTot()">✕</button></div>`;
}
function itemSel(sel){const s=db.services.find(x=>x.nome===sel.value);if(s)sel.nextElementSibling.value=s.preco;updTot()}
function addItem(){$('items').insertAdjacentHTML('beforeend',itemRow())}
function updTot(){if(!$('aTot'))return;const t=[...document.querySelectorAll('#items .iv')].reduce((s,i)=>s+(+i.value||0),0)+(+$('aAd').value||0);const r=Math.round(t*(1-fee($('aPg').value)/100)*100)/100;$('aTot').innerHTML=`Total: <b>${BRL(t)}</b>${r!==t?` · recebido após taxa: <b>${BRL(r)}</b>`:''}`}
function cliHint(){const c=db.clients.find(x=>norm(x.nome)===norm($('aCli').value));const h=$('cliHint');if(!h)return;if(!$('aCli').value.trim()){h.innerHTML='';return}h.innerHTML=c?[c.alergiaDesc?`<span class="pill bad">⚠️ Alergia: ${esc(c.alergiaDesc)}</span>`:'',c.gestante?'<span class="pill warn">Gestante</span>':'',c.diabetes?'<span class="pill warn">Diabetes</span>':'',c.telefone?`<span class="pill">${esc(c.telefone)}</span>`:''].join(' '):'<span class="pill ok">Nova cliente — será cadastrada ao salvar</span>'}
function apptForm(id,preset={}){
 const a=id?db.appts.find(x=>x.id===id):Object.assign({data:cur===todayISO().slice(0,7)?todayISO():cur+'-01',hora:'09:00',status:'agendado',items:[],adicional:0,pagamento:'',descricao:'',ficha:{}},preset);
 const nome=a.clientId?(client(a.clientId)||{}).nome||a.cliente:(a.cliente||'');
 const items=a.items&&a.items.length?a.items:[{}];
 const canSync=!!db.settings.gClientId;
 modal(id?'Editar atendimento':'Novo atendimento',`
 <div class="row"><label class="f">Data<input id="aData" type="date" value="${a.data}"></label><label class="f">Horário<input id="aHora" type="time" value="${a.hora||''}"></label></div>
 <label class="f">Cliente<input id="aCli" list="dlCli" autocomplete="off" value="${esc(nome)}" oninput="cliHint()" placeholder="Digite o nome"></label>
 <datalist id="dlCli">${db.clients.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist>
 <div id="cliHint" class="chips" style="margin:-4px 0 10px"></div>
 <div class="small muted" style="font-weight:600;margin-bottom:4px">Serviços</div>
 <div id="items">${items.map(itemRow).join('')}</div>
 <button type="button" class="btn sm soft" onclick="addItem()" style="margin-bottom:12px">+ serviço</button>
 <div class="row3"><label class="f">Adicional / desconto<input id="aAd" type="number" step="0.01" value="${a.adicional||0}" oninput="updTot()"></label><label class="f">Pagamento<select id="aPg" onchange="updTot()"><option value="">—</option>${opts(PAGS,a.pagamento)}</select></label><label class="f">Status<select id="aSt">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===a.status?'selected':''}>${v[0]}</option>`).join('')}</select></label></div>
 <div id="aTot" class="small" style="margin:-2px 0 12px"></div>
 <label class="f">Descrição (decoração, observações)<input id="aDesc" value="${esc(a.descricao||'')}" placeholder="ex.: francesinha cromada, 2 unhas encapsuladas"></label>
 <details><summary>Ficha técnica da manutenção</summary>
  <label class="f">Unhas saudáveis?<select id="fS"><option value="">—</option>${opts(['Sim','Não','Fragilizadas','Em recuperação'],(a.ficha||{}).saudavel)}</select></label>
  <label class="f">Avaliação (descolamento, infiltração, quebras…)<textarea id="fO">${esc((a.ficha||{}).obs||'')}</textarea></label>
  <label class="f">Produtos utilizados<input id="fP" value="${esc((a.ficha||{}).produtos||'')}" placeholder="primer, base onefix pink, top coat…"></label>
 </details>
 <details><summary>Valor recebido manual</summary><label class="f">Recebido líquido (deixe vazio para calcular com as taxas)<input id="aRec" type="number" step="0.01" value="${a.recebido??''}"></label></details>
 ${canSync?`<label class="ck"><input type="checkbox" id="aSync" ${a.status!=='realizado'||a.gcalId?'checked':''}> Registrar no Google Agenda ${a.gcalId?'<span class="pill gg">já está no Google</span>':gReady()?'':'<span class="small muted">(vai pedir o login do Google)</span>'}</label>`:''}`,
 {onSave:()=>saveAppt(id,a.gcalId),extra:id?`<button class="btn ghost danger" onclick="delAppt('${id}')">Excluir</button>`:''});
 cliHint();updTot();
}
function saveAppt(id,presetG){
 const nome=$('aCli').value.trim();if(!nome)return toast('Informe a cliente');if(!$('aData').value)return toast('Informe a data');
 let c=db.clients.find(x=>norm(x.nome)===norm(nome));if(!c){c=newClient({nome:nome.replace(/\s+/g,' ')});db.clients.push(c);toast('Nova cliente cadastrada 🌿')}
 const items=[...document.querySelectorAll('#items .irow')].map(r=>({servico:r.querySelector('.is').value,valor:+r.querySelector('.iv').value||0})).filter(i=>i.servico||i.valor);
 const doSync=$('aSync')&&$('aSync').checked;
 let a=id?db.appts.find(x=>x.id===id):null;const isNew=!a;if(!a)a={id:uid(),criadoEm:new Date().toISOString(),gcalId:presetG||''};
 Object.assign(a,{data:$('aData').value,hora:$('aHora').value,clientId:c.id,cliente:c.nome,items,adicional:+$('aAd').value||0,pagamento:$('aPg').value,status:$('aSt').value,descricao:$('aDesc').value.trim(),recebido:$('aRec').value===''?null:+$('aRec').value,ficha:{saudavel:$('fS').value,obs:$('fO').value.trim(),produtos:$('fP').value.trim()}});
 if(doSync)a.gPending=true;if(isNew)db.appts.push(a);save();closeModal();render();
 if(doSync){if(gReady())syncAppt(a);else if(db.settings.gClientId)gConnect(flushPending)}
}
function delAppt(id){const a=db.appts.find(x=>x.id===id);if(!confirm('Excluir este atendimento?'+(a.gcalId?' O evento também será removido do Google Agenda.':'')))return;if(a.gcalId){if(gReady())gFetch(`calendars/${cal()}/events/${a.gcalId}`,{method:'DELETE'}).catch(()=>{(db.gDelQ=db.gDelQ||[]).push(a.gcalId);save()});else(db.gDelQ=db.gDelQ||[]).push(a.gcalId)}db.appts=db.appts.filter(x=>x.id!==id);save();closeModal();render();toast('Excluído')}

/* ================= RECEITAS ================= */
function rReceitas(v){
 const s=stats(cur),q=norm(rcQuery);
 let L=s.ap.slice().sort(byDT);if(q)L=L.filter(a=>norm(cname(a)+' '+servs(a)+' '+a.pagamento).includes(q));

function genFixed(){let n=0;db.fixed.filter(f=>f.ativo).forEach(f=>{let desc=f.descricao;if(+f.parcelas){if(!f.inicio)return;const idx=mDiff(f.inicio,cur)+1;if(idx<1||idx>+f.parcelas)return;desc+=` (${idx}/${f.parcelas})`}if(db.expenses.some(e=>e.mes===cur&&(e.fixedId===f.id||norm(e.descricao).replace(/\s*\(?\d+\/\d+\)?$/,'')===norm(f.descricao))))return;db.expenses.push({id:uid(),fixedId:f.id,mes:cur,descricao:desc,valor:+f.valor,data:cur+'-'+p2(Math.min(+f.dia||1,28)),status:'Pendente',tipo:f.tipo,meio:f.meio});n++});save();render();toast(n?`${n} despesas fixas lançadas em ${mLabel(cur)}`:'As despesas fixas deste mês já estavam lançadas')}
function lancarDizimo(){const s=stats(cur),val=Math.round(s.fat*(+db.settings.dizimoPct||0))/100;if(!val)return toast('Sem faturamento no mês');let e=db.expenses.find(x=>x.dizimo&&x.mes===cur);if(e)e.valor=val;else db.expenses.push({id:uid(),dizimo:true,mes:cur,descricao:'Dízimo',valor:val,data:'',status:'Pendente',tipo:'Despesas fixas',meio:'À vista'});save();render();toast('Dízimo: '+BRL(val))}

const RPRE=[['mes','Este mês'],['mesant','Mês passado'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['12m','Últimos 12 meses'],['ano','Este ano'],['anoant','Ano passado'],['tudo','Todo o período'],['custom','Personalizado']];
function rRange(){const td=todayISO(),m=td.slice(0,7),y=+td.slice(0,4);switch(rPreset){case'mes':return[m+'-01',mEnd(m)];case'mesant':{const q=addM(m,-1);return[q+'-01',mEnd(q)]}case'3m':return[addM(m,-2)+'-01',mEnd(m)];case'6m':return[addM(m,-5)+'-01',mEnd(m)];case'12m':return[addM(m,-11)+'-01',mEnd(m)];case'ano':return[y+'-01-01',y+'-12-31'];case'anoant':return[(y-1)+'-01-01',(y-1)+'-12-31'];case'tudo':{const c=[...db.appts.map(a=>a.data).filter(Boolean),...Object.keys(db.history).map(k=>k+'-01')].sort();return[c[0]||m+'-01',mEnd(m)]}default:{let f=rFrom||m+'-01',t=rTo||mEnd(m);if(t<f)[f,t]=[t,f];return[f,t]}}}
function rSetPreset(v){if(v==='custom'){const[f,t]=rRange();rFrom=f;rTo=t}rPreset=v;render()}
function rSetDate(k,v){const[f,t]=rRange();rFrom=f;rTo=t;if(k==='f')rFrom=v;else rTo=v;rPreset='custom';render()}
function bKey(d,g){return g==='dia'?d:g==='semana'?wkStart(d):d.slice(0,7)}
function bLabel(k,g,short){if(g==='dia')return short?fds(k):`${dow(k)}, ${fd(k)}`;if(g==='semana')return short?fds(k):`${fds(k)} a ${fds(addD(k,6))}`;return short?mShort(k):mLabel(k)}
function bKeys(f,t,g){const ks=[];if(g==='mes'){for(let m=f.slice(0,7);m<=t.slice(0,7);m=addM(m,1))ks.push(m)}else if(g==='semana'){for(let d=wkStart(f);d<=t;d=addD(d,7))ks.push(d)}else{for(let d=f;d<=t;d=addD(d,1))ks.push(d)}return ks}
const expDate=e=>(e.data&&e.data.slice(0,7)===e.mes)?e.data:e.mes+'-01';
function periodData(f,t,g){
 const ap=db.appts.filter(a=>a.status==='realizado'&&a.data>=f&&a.data<=t);
 const ex=db.expenses.filter(e=>{const d=expDate(e);return d>=f&&d<=t});
 const keys=bKeys(f,t,g),B={};keys.forEach(k=>B[k]={k,fat:0,gasto:0,n:0,cli:new Set(),hist:false});
 ap.forEach(a=>{const b=B[bKey(a.data,g)];if(!b)return;b.fat+=rec(a);b.n++;b.cli.add(a.clientId||a.cliente)});
 ex.forEach(e=>{const b=B[bKey(expDate(e),g)];if(b)b.gasto+=+e.valor||0});
 if(g==='mes')keys.forEach(k=>{const hh=db.history[k],b=B[k];if(!hh||!(f<=k+'-01'&&t>=mEnd(k)))return;if(!b.n){b.fat=hh.fat;b.hist=true}if(!ex.some(e=>e.mes===k)){b.gasto=hh.gasto;b.hist=true}});
 const rows=keys.map(k=>B[k]);rows.forEach(b=>{b.lucro=b.fat-b.gasto;b.meta=g==='mes'?(+db.goals[b.k]||0):0;b.ncli=b.cli.size});
 return{ap,ex,rows,fat:rows.reduce((s,b)=>s+b.fat,0),gasto:rows.reduce((s,b)=>s+b.gasto,0),n:ap.length,hist:rows.some(b=>b.hist)};
}
function pct(a,b,inv){if(!b)return'';const x=(a-b)/Math.abs(b)*100,good=inv?x<=0:x>=0;return`<span style="color:${good?'var(--brand)':'var(--danger)'}">${x>=0?'▲':'▼'} ${Math.abs(x).toFixed(0)}%</span> vs período anterior`}
function rRelatorios(v){
 const[f,t]=rRange(),g=rGroup,D=periodData(f,t,g),len=dDiff(f,t)+1,P=periodData(addD(f,-len),addD(f,-1),g);
 const lucro=D.fat-D.gasto,tk=D.n?D.fat/D.n:0,ptk=P.n?P.fat/P.n:0;
 const first={};db.appts.forEach(a=>{if(a.status==='realizado'&&a.clientId&&(!first[a.clientId]||a.data<first[a.clientId]))first[a.clientId]=a.data});
 const novas=Object.entries(first).filter(([,d])=>d>=f&&d<=t).map(([id])=>client(id)).filter(Boolean);
 const sv={},cl={},pg={},wd=DOW.map(()=>({n:0,v:0})),tp={};
 D.ap.forEach(a=>{(a.items||[]).forEach(i=>{const k=i.servico||'Outros';sv[k]=sv[k]||{n:0,v:0};sv[k].n++;sv[k].v+=+i.valor||0});const n=cname(a);cl[n]=cl[n]||{n:0,v:0};cl[n].n++;cl[n].v+=rec(a);const q=a.pagamento||'Não informado';pg[q]=pg[q]||{v:0};pg[q].v+=rec(a);const[y,m,d]=a.data.split('-').map(Number);const w=new Date(y,m-1,d).getDay();wd[w].n++;wd[w].v+=rec(a)});
 D.ex.forEach(e=>{const k=e.tipo||'Sem tipo';tp[k]=tp[k]||{v:0};tp[k].v+=+e.valor||0});
 const org={};novas.forEach(c=>{const o=norm(c.origem);const k=!o?'Não informado':o.startsWith('indica')?'Indicação':o.startsWith('insta')?'Instagram':o.includes('placa')?'Placa em frente':o.startsWith('google')?'Google':c.origem.split(',')[0].trim();org[k]=org[k]||{v:0};org[k].v++});
 const top=(o,n=8)=>Object.entries(o).sort((a,b)=>b[1].v-a[1].v).slice(0,n);
 const lst=(arr,lab,col)=>{const mx=arr[0]?arr[0][1].v:1;return arr.length?arr.map(([k,o])=>`<div class="li"><div class="grow"><b>${esc(k)}</b><div class="bar"><i style="width:${mx?o.v/mx*100:0}%;${col?'background:'+col:''}"></i></div></div><div class="num small">${lab(o)}</div></div>`).join(''):'<div class="empty">Sem dados no período.</div>'};
 const showRows=(g==='dia'?D.rows.filter(b=>b.n||b.gasto):D.rows).slice().reverse();
 const wmx=Math.max(1,...wd.map(x=>x.v));
 v.innerHTML=`<div class="toolbar"><h2>Relatórios</h2><button class="btn ghost" onclick="exportRel()">⬇ Exportar CSV</button></div>
 <div class="card sect rfilters">
  <label>Período<select onchange="rSetPreset(this.value)">${RPRE.map(([k,l])=>`<option value="${k}" ${k===rPreset?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>De<input type="date" value="${f}" onchange="rSetDate('f',this.value)"></label>
  <label>Até<input type="date" value="${t}" onchange="rSetDate('t',this.value)"></label>
  <label>Agrupar por<div class="seg">${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([k,l])=>`<button class="${g===k?'on':''}" onclick="rGroup='${k}';render()">${l}</button>`).join('')}</div></label>
  <span class="small muted" style="align-self:center">${len} dias · ${fd(f)} a ${fd(t)}</span>
 </div>
 <div class="kpis sect">${kpi('💰 Faturado',BRL(D.fat),pct(D.fat,P.fat))}${kpi('💸 Gastos',BRL(D.gasto),pct(D.gasto,P.gasto,1))}${kpi('💲 Líquido',BRL(lucro),D.fat?`margem ${(lucro/D.fat*100).toFixed(0)}%`:'',lucro<0?'var(--danger)':'var(--brand)')}${kpi('💅 Atendimentos',D.n,pct(D.n,P.n))}${kpi('🎟️ Ticket médio',BRL(tk),pct(tk,ptk))}${kpi('🌱 Novas clientes',novas.length,`${new Set(D.ap.map(a=>a.clientId||a.cliente)).size} clientes atendidas`)}</div>
 <div class="card sect"><h3>Faturado × gastos por ${g==='mes'?'mês':g}</h3><div class="chartbox"><canvas id="ch1"></canvas></div>${D.hist?'<div class="small muted" style="margin-top:6px">Meses sem lançamentos detalhados usam os totais do histórico da planilha.</div>':''}</div>

 <tbody>${showRows.length?showRows.map(b=>`<tr class="click" onclick="relGo('${b.k}')"><td>${bLabel(b.k,g)}${b.hist?' <span class="pill" title="Total do histórico da planilha">hist.</span>':''}</td><td class="num">${b.n||''}</td><td class="num">${b.ncli||''}</td><td class="num"><b>${BRL(b.fat)}</b></td><td class="num">${b.n?BRL(b.fat/b.n):''}</td><td class="num">${BRL(b.gasto)}</td><td class="num" style="color:${b.lucro<0?'var(--danger)':'inherit'}">${BRL(b.lucro)}</td>${g==='mes'?`<td class="num">${b.meta?BRL(b.meta):'—'}</td><td class="num">${b.meta?`<span class="pill ${b.fat>=b.meta?'ok':'warn'}">${(b.fat/b.meta*100).toFixed(0)}%</span>`:''}</td>`:''}</tr>`).join(''):`<tr><td colspan="9" class="empty">Sem lançamentos no período.</td></tr>`}</tbody>
 <tfoot><tr><td>Total</td><td class="num">${D.n}</td><td></td><td class="num">${BRL(D.fat)}</td><td class="num">${BRL(tk)}</td><td class="num">${BRL(D.gasto)}</td><td class="num">${BRL(lucro)}</td>${g==='mes'?'<td></td><td></td>':''}</tr></tfoot></table></div>
 <div class="grid g2">
  <div class="card"><h3>💅 Serviços</h3>${lst(top(sv),o=>`${o.n}× · ${BRL(o.v)}`)}</div>
  <div class="card"><h3>👑 Clientes que mais investiram</h3>${lst(top(cl,10),o=>`${o.n} visitas · ${BRL(o.v)}`)}</div>
  <div class="card"><h3>📆 Movimento por dia da semana</h3>${DOW.map((d,i)=>`<div class="li"><div class="grow"><b style="text-transform:capitalize">${d}</b><div class="bar"><i style="width:${wd[i].v/wmx*100}%"></i></div></div><div class="num small">${wd[i].n} atend. · ${BRL(wd[i].v)}</div></div>`).join('')}</div>
  <div class="card"><h3>💳 Formas de pagamento</h3>${lst(top(pg),o=>BRL(o.v))}</div>
  <div class="card"><h3>🧾 Despesas por tipo</h3>${lst(top(tp),o=>BRL(o.v),'#A8D9C4')}</div>
  <div class="card"><h3>📣 Novas clientes por origem</h3>${lst(top(org),o=>o.v+' cliente'+(o.v>1?'s':''))}${novas.length?`<div class="small muted" style="margin-top:8px">${novas.slice(0,12).map(c=>esc(c.nome)).join(', ')}${novas.length>12?'…':''}</div>`:''}</div>
 </div>`;
 if(!window.Chart){$('ch1').parentNode.innerHTML='<div class="empty">O gráfico precisa de internet para carregar.</div>';return}
 const cs=getComputedStyle(document.documentElement),c=k=>cs.getPropertyValue(k).trim();
 charts.push(new Chart($('ch1'),{data:{labels:D.rows.map(b=>bLabel(b.k,g,true)),datasets:[{type:'bar',label:'Faturado',data:D.rows.map(b=>b.fat),backgroundColor:c('--brand'),borderRadius:4},{type:'bar',label:'Gastos',data:D.rows.map(b=>b.gasto),backgroundColor:'#A8D9C4',borderRadius:4},...(g==='mes'&&D.rows.some(b=>b.meta)?[{type:'line',label:'Meta',data:D.rows.map(b=>b.meta||null),borderColor:c('--muted'),borderDash:[5,4],pointRadius:3,spanGaps:true}]:[]),{type:'line',label:'Líquido',data:D.rows.map(b=>b.lucro),borderColor:c('--brand-ink'),tension:.3,pointRadius:D.rows.length>60?0:2}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:c('--muted')}},tooltip:{callbacks:{label:x=>x.dataset.label+': '+BRL(x.raw)}}},scales:{x:{ticks:{color:c('--muted'),maxRotation:0,autoSkip:true},grid:{display:false}},y:{ticks:{color:c('--muted'),callback:x=>'R$ '+(Math.abs(x)>=1000?(x/1000)+'k':x)},grid:{color:c('--line')}}}}}));
}
function relGo(k){if(rGroup==='mes'){cur=k;agDate=k+'-01';go('painel')}else{agDate=k;cur=k.slice(0,7);agView=rGroup==='dia'?'dia':'semana';go('agenda')}}
function exportRel(){const[f,t]=rRange(),g=rGroup,D=periodData(f,t,g);const q=s=>'"'+String(s).replace(/"/g,'""')+'"',n=x=>(+x||0).toFixed(2).replace('.',',');
 const L=[['Período','Atendimentos','Clientes','Faturado','Ticket médio','Gastos','Líquido','Meta'].map(q).join(';'),...D.rows.map(b=>[bLabel(b.k,g),b.n,b.ncli,n(b.fat),n(b.n?b.fat/b.n:0),n(b.gasto),n(b.lucro),n(b.meta)].map(q).join(';'))];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.join('\n')],{type:'text/csv'}));a.download=`relatorio-${f}-a-${t}-${g}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function saveSettings(){const st=db.settings;const g=k=>$(k)?$(k).value:null;if(g('sG')!==null){st.gClientId=g('sG').trim();st.gCalendarId=g('sGc').trim()||'primary'}if(g('sSh')!==null){st.gSheetId=g('sSh').trim();sheetTabs=null}if(g('sTc')!==null){st.taxaCredito=+g('sTc')||0;st.taxaDebito=+g('sTd')||0;st.dizimoPct=+g('sDz')||0;st.retornoDias=+g('sRd')||21;st.duracaoPadrao=+g('sDu')||90}save();if(st.gClientId)loadGsi();render();toast('Configurações salvas')}
function readFile(inp,fn){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{fn(r.result)}catch(e){console.error(e);toast('Erro ao ler o arquivo: '+e.message)}inp.value=''};r.readAsText(f,'utf-8')}
function exportJSON(){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mentha-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importJSON(t){const d=JSON.parse(t);if(!d.clients||!d.appts)return toast('Arquivo de backup inválido');if(!confirm('Substituir os dados atuais pelo backup?'))return;const def=defaults();db=Object.assign(def,d,{settings:Object.assign(def.settings,d.settings||{})});save();render();toast('Backup restaurado ✓')}

/* ===== CSV ===== */
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const first=t.split('\n')[0];const d=first.split(';').length>first.split(',').length?';':',';const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows}
function importClientsCSV(text){const r=importClientsRows(parseCSV(text));if(r.err)return toast(r.err);save();render();toast(`Clientes: ${r.nw} novas, ${r.up} atualizadas`)}
function importClientsRows(rows){
 const hi=rows.findIndex(r=>r.some(c=>norm(c).startsWith('nome')));if(hi<0)return{nw:0,up:0,err:'Não encontrei a coluna "Nome"'};
 const H=rows[hi];const ix=(...k)=>H.findIndex(h=>k.some(x=>norm(h).includes(x)));
 const I={nome:ix('nome completo','nome'),tel:ix('telefone','celular','whats'),nasc:ix('nascimento'),insta:ix('instagram'),end:ix('endereco'),bairro:ix('bairro'),cidade:ix('cidade'),diab:ix('diabetes'),gest:ix('gestante'),alerg:ix('possui alergia'),alergD:ix('alergia a'),prof:ix('trabalha','profiss'),origem:ix('conheceu','origem'),status:ix('status'),indic:ix('indicou','indicad'),cpf:ix('cpf'),cad:ix('carimbo')};
 const get=(r,k)=>I[k]>=0?String(r[I[k]]||'').trim():'';const yes=s=>norm(s).startsWith('sim');const bad=s=>['','nao','não','nada','.','nao tenho','nao tenho alergia','nao nada','nao6','a nada'].includes(norm(s))||norm(s).startsWith('nada');
 let nw=0,up=0;
 rows.slice(hi+1).forEach(r=>{const nome=get(r,'nome').replace(/\s+/g,' ');if(!nome||norm(nome).startsWith('nome'))return;let c=db.clients.find(x=>norm(x.nome)===norm(nome));const isNew=!c;if(!c)c=newClient({nome});
  const set=(f,v)=>{if(v)c[f]=v};set('telefone',get(r,'tel'));set('nascimento',pDate(get(r,'nasc')));set('instagram',get(r,'insta'));set('endereco',get(r,'end'));set('bairro',get(r,'bairro'));set('cidade',get(r,'cidade'));set('profissao',get(r,'prof'));set('origem',get(r,'origem'));set('indicadaPor',get(r,'indic'));set('cpf',get(r,'cpf'));
  if(get(r,'diab'))c.diabetes=yes(get(r,'diab'));if(get(r,'gest'))c.gestante=yes(get(r,'gest'));const ad=get(r,'alergD');if(ad&&!bad(ad))c.alergiaDesc=ad;else if(yes(get(r,'alerg'))&&!c.alergiaDesc)c.alergiaDesc='Sim (não especificado)';
  const s=norm(get(r,'status'));if(s)c.status=s.startsWith('inativ')?'Inativa':'Ativa';const cad=pDate(get(r,'cad'));if(cad&&isNew)c.criadoEm=cad;
  if(isNew){db.clients.push(c);nw++}else up++});
 return{nw,up};
}
function movMsg(r){return`Importado: ${r.na} atendimentos, ${r.ne} despesas${r.nc?`, ${r.nc} clientes novas`:''}${r.dup?` · ${r.dup} repetidos ignorados`:''}`}
function importMovCSV(text){const r=importMovRows(parseCSV(text),cur);if(r.err)return toast(r.err);save();render();toast(movMsg(r))}
function importMovRows(rows,mes){
 const fy=+mes.slice(0,4);let na=0,ne=0,dup=0,nc=0,meta=0;
 const mr=rows.find(r=>r.some(c=>norm(c).includes('meta de faturamento')));if(mr){const v=mr.map(money).find(x=>x>0);if(v&&!db.goals[mes]){db.goals[mes]=v;meta=v}}
 const hi=rows.findIndex(r=>{const n=r.map(norm);return n.includes('cliente')&&n.includes('data')});
 const ehi=rows.findIndex(r=>r.map(norm).includes('o que'));
 if(hi<0&&ehi<0)return{na,ne,dup,nc,meta,err:'Não encontrei os cabeçalhos "Data/Cliente" ou "O que"'};
 if(hi>=0){
  const H=rows[hi].map(norm),oq=H.indexOf('o que'),lim=oq>=0?oq:H.length;
  const find=p=>{for(let i=0;i<lim;i++)if(p(H[i]))return i;return-1};
  const iD=find(h=>h==='data'),iC=find(h=>h==='cliente'),iP=find(h=>h.startsWith('procedimento')),iV=find(h=>h==='valor'||h.includes('$ procedimento')),iA=find(h=>h.startsWith('adicional')||h.includes('$ adicional')),iPg=find(h=>h==='pagamento'),iT=find(h=>h.startsWith('total bruto')&&!h.includes('faturado')),iDs=find(h=>h.startsWith('descri'));
  const groups=new Map();
  rows.slice(hi+1).forEach((r,ix)=>{const cli=String(r[iC]||'').trim();if(norm(cli)==='cliente')return;const data=pDate(r[iD],fy);if(!data)return;const proc=iP>=0?String(r[iP]||'').trim():'';const val=iV>=0?money(r[iV]):0,ad=iA>=0?money(r[iA]):0;const tb=iT>=0&&String(r[iT]||'').trim()!==''?money(r[iT]):null;if(!proc&&!val&&!tb)return;
   const key=data+'|'+(cli?norm(cli):'#'+ix);let g=groups.get(key);if(!g){g={data,cli,items:[],adicional:0,recebido:0,pag:normPag(r[iPg]),desc:[]};groups.set(key,g)}
   g.items.push({servico:canonProc(proc,val||tb,data),valor:val});g.adicional+=ad;g.recebido+=tb!==null?tb:val+ad;if(iDs>=0&&String(r[iDs]||'').trim())g.desc.push(String(r[iDs]).trim());if(!g.pag)g.pag=normPag(r[iPg])});
  groups.forEach(g=>{let c=null;if(g.cli){c=findClient(g.cli);if(!c){c=newClient({nome:g.cli.replace(/\s+/g,' ')});db.clients.push(c);nc++}}
   const nm=c?c.nome:(g.desc[0]||g.items.map(i=>i.servico).join(' + ')||'Avulso');
   const rcv=Math.round(g.recebido*100)/100;if(db.appts.some(a=>(c?a.clientId===c.id:(!a.clientId&&norm(a.cliente)===norm(nm)))&&a.data===g.data&&a.status==='realizado'&&Math.abs(rec(a)-rcv)<.01)){dup++;return}
   db.appts.push({id:uid(),data:g.data,hora:'',clientId:c?c.id:'',cliente:nm,items:g.items,adicional:Math.round(g.adicional*100)/100,pagamento:g.pag,status:'realizado',descricao:g.desc.join(' · '),recebido:rcv,ficha:{},importado:true});na++});
 }
 if(ehi>=0){
  const H=rows[ehi].map(norm),oq=H.indexOf('o que'),hasD=H[oq-1]==='data';
  rows.slice(ehi+1).forEach(r=>{const d=String(r[oq]||'').trim(),val=money(r[oq+1]);if(!d||!val||norm(d).startsWith('total')||norm(d)==='o que')return;
   if(db.expenses.some(e=>e.mes===mes&&norm(e.descricao)===norm(d)&&Math.abs(e.valor-val)<.01)){dup++;return}
   const sit=norm(r[oq+2]).startsWith('pago')?'Pago':'Pendente';const tipo=TIPOS.find(t=>norm(t)===norm(r[oq+3]))||String(r[oq+3]||'').trim()||'Custos';const meio=String(r[oq+4]||'').trim()||'À vista';
   db.expenses.push({id:uid(),mes,descricao:d,valor:val,data:hasD?pDate(r[oq-1],fy):'',status:sit,tipo,meio,importado:true});ne++});
 }
 return{na,ne,dup,nc,meta};
}

/* ================= GOOGLE AGENDA ================= */
const cal=()=>encodeURIComponent(db.settings.gCalendarId||'primary');
function gReady(){return!!(gToken&&gToken.exp>Date.now())}
function loadGsi(cb){if(window.google&&google.accounts&&google.accounts.oauth2){cb&&cb();return}if(document.getElementById('gsi')){return}const s=document.createElement('script');s.id='gsi';s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>cb&&cb();s.onerror=()=>toast('Não foi possível carregar o login do Google');document.head.appendChild(s)}
function gConnect(cb){
 const cid=(db.settings.gClientId||'').trim();if(!cid){go('config');return toast('Cole o Client ID do Google primeiro')}
 if(!(window.google&&google.accounts&&google.accounts.oauth2)){loadGsi(()=>toast('Pronto — clique novamente em “Entrar com Google”'));return}
 tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/spreadsheets.readonly',callback:r=>{if(r.error)return toast('Google: '+r.error);gToken={t:r.access_token,exp:Date.now()+((+r.expires_in||3600)-60)*1000};try{localStorage.setItem('mentha_gtok',JSON.stringify(gToken))}catch(e){}gEv.key='';toast('Google conectado ✓');if(typeof cb==='function')cb();else render();if(cb!==flushPending&&(gPendList().length||(db.gDelQ||[]).length))flushPending()}});
 tokenClient.requestAccessToken(gToken?{prompt:''}:{});
}
async function gFetch(path,o={}){const r=await fetch('https://www.googleapis.com/calendar/v3/'+path,Object.assign({},o,{headers:{Authorization:'Bearer '+gToken.t,'Content-Type':'application/json'}}));if(r.status===204||r.status===410)return null;const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j}
function apptEnd(a){const dur=(a.items||[]).reduce((t,i)=>{const s=db.services.find(x=>x.nome===i.servico);return t+(s?+s.duracao||0:0)},0)||+db.settings.duracaoPadrao||90;const[y,m,d]=a.data.split('-').map(Number);const[h,mi]=(a.hora||'09:00').split(':').map(Number);const e=new Date(y,m-1,d,h,mi+dur);return e.getFullYear()+'-'+p2(e.getMonth()+1)+'-'+p2(e.getDate())+'T'+p2(e.getHours())+':'+p2(e.getMinutes())+':00'}
function gBody(a){const c=client(a.clientId)||{};return{summary:`${a.status==='realizado'?'✅':'💅'} ${cname(a)} — ${servs(a)}`,description:[`Cliente: ${cname(a)}`,c.telefone?`Telefone: ${c.telefone}`:'',`Valor: ${BRL(tot(a))}`,c.alergiaDesc?`⚠️ Alergia: ${c.alergiaDesc}`:'',a.descricao||'','— Mentha CRM'].filter(Boolean).join('\n'),start:{dateTime:`${a.data}T${a.hora||'09:00'}:00`,timeZone:'America/Sao_Paulo'},end:{dateTime:apptEnd(a),timeZone:'America/Sao_Paulo'}}}
function gTemplate(a){const s=a.data.replace(/-/g,'')+'T'+(a.hora||'09:00').replace(':','')+'00',e=apptEnd(a).replace(/[-:]/g,'');const b=gBody(a);return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(b.summary)+'&dates='+s+'/'+e+'&ctz=America/Sao_Paulo&details='+encodeURIComponent(b.description)}
async function syncAppt(a,quiet){try{if(a.status==='cancelado'||a.status==='faltou'){if(a.gcalId){await gFetch(`calendars/${cal()}/events/${a.gcalId}`,{method:'DELETE'});a.gcalId=''}}else if(a.gcalId){await gFetch(`calendars/${cal()}/events/${a.gcalId}`,{method:'PATCH',body:JSON.stringify(gBody(a))})}else{const j=await gFetch(`calendars/${cal()}/events`,{method:'POST',body:JSON.stringify(gBody(a))});a.gcalId=j.id}a.gPending=false;save();if(!quiet){toast('Google Agenda atualizada ✓');render()}return true}catch(e){if(/401|invalid|credential/i.test(e.message)){gToken=null}toast('Erro Google: '+e.message);return false}}
async function flushPending(){if(!gReady())return gConnect(flushPending);let n=0,er=0;
 for(const id of (db.gDelQ||[]).slice()){try{await gFetch(`calendars/${cal()}/events/${id}`,{method:'DELETE'})}catch(e){}db.gDelQ=db.gDelQ.filter(x=>x!==id)}
 for(const a of gPendList()){if(a.status==='realizado'&&!a.gcalId){a.gPending=false;continue}if(await syncAppt(a,true))n++;else er++}
 save();gEv.key='';render();toast(n||er?`${n} atendimento(s) enviados ao Google Agenda${er?` · ${er} com erro`:''} ✓`:'Google Agenda em dia ✓')}
function importGEvent(id){const e=(gEv.items||[]).find(x=>x.id===id);if(!e)return;const st=e.start.dateTime||e.start.date;const sum=String(e.summary||'').replace(/^(💅|✅)\s*/,'');const[nome,sv]=sum.split(' — ');const items=(sv||'').split('+').map(s=>s.trim()).filter(Boolean).map(n=>{const s=db.services.find(x=>norm(x.nome)===norm(n));return{servico:s?s.nome:n,valor:s?s.preco:''}});const c=findClient(nome);apptForm(null,{data:st.slice(0,10),hora:e.start.dateTime?st.slice(11,16):'',clientId:c?c.id:'',cliente:(nome||'').trim(),items,gcalId:e.id})}



const PROC_ALIAS={'padicure tradicional':'Pedicure tradicional','pedicure':'Pedicure tradicional','pedicure tradicional':'Pedicure tradicional','podal russo':'Podal russo','manicure tradicional':'Manicure tradicional','manicure russa':'Manicure russa','mentoria':'Mentoria','mentoria (parcela)':'Mentoria','corrigir':'Reparo de unha','taxa cancelamento':'Taxa de cancelamento','cancelamento':'Taxa de cancelamento','taxa de agendamento':'Taxa de agendamento','workshop':'Workshop','curso on-line':'Curso on-line','curso on-line (parcela)':'Curso on-line','manicure e pedicure':'Manicure e pedicure tradicional','manicure e pedicure tradicional':'Manicure e pedicure tradicional','alongamento':'Alongamento','manutencao':'Manutenção','esmaltacao em gel':'Esmaltação em gel','remocao de gel':'Remoção de gel','cuticulagem russa':'Cuticulagem russa','curso manicure russa':'Curso Manicure Russa','curso alongamento':'Curso Alongamento'};
function canonProc(p,v,data){const n=norm(p);if(n){if(PROC_ALIAS[n])return PROC_ALIAS[n];const s=db.services.find(x=>norm(x.nome)===n);return s?s.nome:String(p).trim()}
 v=+v||0;if(!v)return'Serviço';if(v>=140&&v<=180)return'Manicure russa';if(v>=195&&v<=235)return'Alongamento';if(v>=95&&v<=105)return'Esmaltação em gel';if(v>=70&&v<=82&&data>='2025-11')return'Podal russo';if(v>=40&&v<=65)return'Pedicure tradicional';return'Serviço'}
/* ================= PLANILHA GOOGLE ================= */
let sheetTabs=null;
const MNOR=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function tabMonth(t){const m=norm(t).match(/^(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)[\s._\-\/]*(\d{2}|\d{4})$/);if(!m)return'';let y=+m[2];if(y<100)y+=2000;return y+'-'+p2(MNOR.indexOf(m[1])+1)}
function sheetId(){const s=String(db.settings.gSheetId||'').trim();const m=s.match(/\/d\/([\w-]+)/);return m?m[1]:s}
async function sFetch(path){const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheetId())+path,{headers:{Authorization:'Bearer '+gToken.t}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('erro '+r.status));return j}
function sheetReady(cb){if(!sheetId()){go('config');toast('Informe o link da planilha');return false}if(!db.settings.gClientId){go('config');toast('Configure o Client ID do Google primeiro');return false}if(!gReady()){gConnect(cb);return false}return true}
async function listTabs(){if(!sheetReady(listTabs))return;try{const j=await sFetch('?fields=properties.title,sheets.properties.title');sheetTabs={title:j.properties.title,tabs:j.sheets.map(s=>s.properties.title)};render();toast(`${sheetTabs.tabs.length} abas encontradas`)}catch(e){toast('Planilha: '+e.message)}}
async function importTabs(titles){
 if(!titles||!titles.length)return toast('Selecione ao menos uma aba');if(!sheetReady(()=>importTabs(titles)))return;
 try{toast('Lendo a planilha…');
  const q=titles.map(t=>'ranges='+encodeURIComponent("'"+t.replace(/'/g,"''")+"'")).join('&');
  const j=await sFetch('/values:batchGet?valueRenderOption=FORMATTED_VALUE&'+q);
  const tabs=titles.map((t,i)=>({t,rows:((j.valueRanges||[])[i]||{}).values||[]}));
  const T={nw:0,up:0,na:0,ne:0,dup:0,nc:0,metas:0};
  tabs.filter(x=>!tabMonth(x.t)).forEach(x=>{const r=importClientsRows(x.rows);T.nw+=r.nw;T.up+=r.up});
  tabs.filter(x=>tabMonth(x.t)).sort((a,b)=>tabMonth(a.t).localeCompare(tabMonth(b.t))).forEach(x=>{const r=importMovRows(x.rows,tabMonth(x.t));T.na+=r.na;T.ne+=r.ne;T.dup+=r.dup;T.nc+=r.nc;if(r.meta)T.metas++});
  db.settings.lastSheetSync=new Date().toISOString();save();render();
  toast(`Planilha: ${T.nw+T.nc} clientes novas, ${T.na} atendimentos, ${T.ne} despesas${T.metas?`, ${T.metas} metas`:''}${T.dup?` · ${T.dup} já existiam`:''}`);
 }catch(e){toast('Planilha: '+e.message)}
}
async function syncSheetNow(){if(!sheetReady(syncSheetNow))return;try{if(!sheetTabs){const j=await sFetch('?fields=properties.title,sheets.properties.title');sheetTabs={title:j.properties.title,tabs:j.sheets.map(s=>s.properties.title)}}const sel=sheetTabs.tabs.filter(t=>t==='Clientes'||tabMonth(t)===cur);if(!sel.some(t=>tabMonth(t)))toast(`Não achei a aba de ${mLabel(cur)} — importando só clientes`);await importTabs(sel)}catch(e){toast('Planilha: '+e.message)}}
